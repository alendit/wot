[package]
name = "wot"
version = "0.1.0"
edition = "2021"
description = "Create compact outlines from source and data files for agents"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
pulldown-cmark = "0.13"
ruff_python_ast = { package = "rustpython-ruff_python_ast", version = "0.15.8" }
ruff_python_parser = { package = "rustpython-ruff_python_parser", version = "0.15.8" }
ruff_text_size = { package = "rustpython-ruff_text_size", version = "0.15.8" }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.14"

[[bin]]
name = "wot"
path = "src/main.rs"
