[package]
name = "wot-cli"
version = "0.1.2"
edition = "2021"
description = "Create compact outlines from source and data files for agents"
license = "MIT"
repository = "https://github.com/alendit/wot"
homepage = "https://github.com/alendit/wot"
documentation = "https://docs.rs/wot-cli"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
pulldown-cmark = "0.13"
ruff_python_ast = { package = "rustpython-ruff_python_ast", version = "0.15.8" }
ruff_python_parser = { package = "rustpython-ruff_python_parser", version = "0.15.8" }
ruff_text_size = { package = "rustpython-ruff_text_size", version = "0.15.8" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
toml = "0.8"
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-clojure-orchard = "0.2"
tree-sitter-cpp = "0.23"
tree-sitter-elisp = "1.6"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.14"

[lib]
name = "wot"
path = "src/lib.rs"

[[bin]]
name = "wot"
path = "src/main.rs"
